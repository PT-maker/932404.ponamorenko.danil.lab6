<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Список фильмов</title>
  <meta name="theme-color" content="#1f2a44">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>🎬 Фильмы по рейтингу</h1>
    <nav><a href="/">Главная</a> <a href="/about">О себе</a></nav>
  </header>

  <main>
    <div class="filter">
      <label for="minRating">Минимальный рейтинг:</label>
      <input id="minRating" type="number" step="0.1" placeholder="например, 7">
      <button id="apply">Показать</button>
      <button id="reset" class="secondary">Сбросить</button>
    </div>

    <p id="message" role="status"></p>
    <ul id="movies"></ul>
  </main>

  <script src="/app.js"></script>
</body>
</html>
